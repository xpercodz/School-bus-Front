<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <meta name="theme-color" content="#005bbf" />
    <!-- Title + description are set per-route and per-locale by App.tsx. -->
    <title>School Bus Transit</title>
    <meta name="description" content="School bus attendance and transit monitoring" />

    <!-- Material Symbols Rounded + Outlined. Self-hosting these via
         @fontsource is a tracked hardening item (SECURITY_ROADMAP Tier 1) —
         this CDN link is the app's only external runtime asset load. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:wght,FILL@100..700,0..1&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
